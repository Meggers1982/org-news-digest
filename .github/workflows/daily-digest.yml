name: Daily News Digest

on:
  schedule:
    # 13:00 UTC (~8am Central), every day
    - cron: "0 13 * * *"

  # Allow manual runs from the GitHub Actions UI
  workflow_dispatch:

jobs:
  digest:
    name: Fetch, curate, and store org + press digests
    runs-on: ubuntu-latest
    # Backstop against a stalled feed or API call burning the 6h default.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: scripts
        run: python main.py
